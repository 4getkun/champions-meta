<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>showcase</title>
<!-- 仕上がりの確認用: site/ を PC とスマホ × ライトとダークで並べる（python -m http.server でリポジトリの根から配る） -->
<style>
body{margin:0;background:#e9e9ee;font-family:'Yu Gothic UI',system-ui,sans-serif;padding:32px;width:2560px}
h1{font-size:34px;margin:0 0 8px}p{margin:0 0 24px;color:#555;font-size:18px}
.row{display:flex;gap:32px;align-items:flex-start}
figure{margin:0}figcaption{font-size:22px;font-weight:700;margin-bottom:10px}
.d{width:1440px;height:2300px;border:0;transform:scale(.5);transform-origin:0 0}
.dw{width:720px;height:1150px;overflow:hidden;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.12)}
.m{width:390px;height:1150px;border:0;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.12)}
</style></head><body>
<h1>チャンピオンズ メタ — 実装（A ライト / A1 ダーク / A5 スマホ）</h1>
<p>site/ を out/ の実データで表示したもの。PC は 1440px を 50% に縮小、スマホは 390px 等倍。</p>
<div class="row">
<figure><figcaption>PC · ライト</figcaption><div class="dw"><iframe class="d" src="../site/?data=../out/&theme=light"></iframe></div></figure>
<figure><figcaption>PC · ダーク</figcaption><div class="dw"><iframe class="d" src="../site/?data=../out/&theme=dark"></iframe></div></figure>
<figure><figcaption>スマホ · ライト</figcaption><iframe class="m" src="../site/?data=../out/&theme=light"></iframe></figure>
<figure><figcaption>スマホ · ダーク</figcaption><iframe class="m" src="../site/?data=../out/&theme=dark"></iframe></figure>
</div></body></html>

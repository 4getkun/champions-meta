name: update data

on:
  # 定期実行は Windows タスク ChampionsMeta-Update へ移管。Actions は手動の復旧用だけ残す。
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      # Smogon は毎回見に行くが、持っている月は取らない（新しい月が出たときだけ増える）
      - run: python -m cmeta all
      - name: commit
        # 通信失敗でも取得済みデータと再開カーソルは残す。失敗した更新の公開は deploy 側で止める。
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data out
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "chore: update data $(TZ=Asia/Tokyo date +%F)"
            git push
          fi
